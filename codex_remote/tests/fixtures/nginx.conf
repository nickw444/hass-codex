events {}
http {
  server {
    listen 8080;
    location /api/hassio_ingress/codex_remote/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Ingress-Path /api/hassio_ingress/codex_remote;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://web:8099/;
    }
  }
}
