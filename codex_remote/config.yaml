name: Codex Remote
version: "0.2.0"
slug: codex_remote
description: Codex Remote Control and experimental codex-webui for your Home Assistant configuration
url: https://github.com/nickw444/hass-codex
stage: experimental
arch:
  - amd64
  - aarch64

init: false

ingress: true
ingress_port: 8099
ingress_stream: true
panel_admin: true
panel_icon: mdi:code-braces
panel_title: Codex
startup: application
boot: auto

image: ghcr.io/nickw444/{arch}-addon-hass-codex

map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  ha_mcp_url: ""
  pairing_code_on_start: true
  force_device_login_on_start: false

schema:
  ha_mcp_url: password
  pairing_code_on_start: bool
  force_device_login_on_start: bool
