name: Build add-on

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: home-assistant/builder@6cb4fd3d1338b6e22d0958a4bcb53e0965ea63b4
        with:
          image: ${{ matrix.arch }}
          args: |
            --docker-hub-check \
            --${{ matrix.arch }} \
            --target /data/codex_remote \
            --image ${{ matrix.arch }}-addon-hass-codex \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon
